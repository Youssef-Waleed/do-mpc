name: Test Python Package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        requirements-file: ["requirements_full.txt", "requirements.txt"]

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Install the exact requirements file assigned by the matrix
          pip install -r ${{ matrix.requirements-file }}
          
          # 2. Force downgrade NumPy to bypass the 2.0 dimensional array crash
          pip install "numpy<2.0.0"
          
      - name: Test
        run: |
          cd testing
          python -m unittest