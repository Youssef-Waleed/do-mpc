name: Test Python Package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dimension 1: The Python versions
        python-version: ["3.10", "3.11", "3.12"]
        # Dimension 2: The exact names of the requirement files
        requirements-file: ["requirements_full.txt", "requirements.txt"]

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dynamically inject the requirement file name from the matrix
          pip install -r ${{ matrix.requirements-file }}
          
      - name: Test
        run: |
          cd testing
          python -m unittest